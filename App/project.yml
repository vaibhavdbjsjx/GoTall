# XcodeGen spec for the iOS app target. Generate the project on a Mac with:
#   brew install xcodegen   # developer tool only; not an app dependency
#   cd App && xcodegen generate && open GrowthApp.xcodeproj
#
# Brand: Linden. APP_DISPLAY_NAME must match BrandConfig.displayName (Sources/GrowthCore/Brand/BrandConfig.swift).
# The bundle ID and product IDs must match what you register in App Store Connect (docs/release-checklist.md).
name: GrowthApp
options:
  bundleIdPrefix: app.linden.growth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GrowthPackage:
    path: ..
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_DISPLAY_NAME: "Linden"
targets:
  GrowthApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
    dependencies:
      - package: GrowthPackage
        product: GrowthCore
      - package: GrowthPackage
        product: AppFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.linden.growth
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

  # Runs the real StoreKit 2 service against the local StoreKit test environment (Products.storekit).
  GrowthAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/StoreKit
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: GrowthApp
      - package: GrowthPackage
        product: GrowthCore
      - package: GrowthPackage
        product: AppFeatures
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.linden.growth.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

  # UI tests for the commercial flows (Profile, Premium, paywall, reminders, report).
  GrowthAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: GrowthApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.linden.growth.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: GrowthApp

schemes:
  GrowthApp:
    build:
      targets:
        GrowthApp: all
    run:
      config: Debug
      # Local StoreKit testing when running from Xcode. Test prices only; real prices come from App Store Connect.
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      targets:
        - GrowthAppTests
        - GrowthAppUITests
    archive:
      config: Release
