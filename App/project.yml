# XcodeGen spec for the iOS app target. Generate the project on a Mac with:
#   brew install xcodegen   # developer tool only; not an app dependency
#   cd App && xcodegen generate && open GrowthApp.xcodeproj
#
# Branding: change APP_DISPLAY_NAME and PRODUCT_BUNDLE_IDENTIFIER here, and BrandConfig in
# Sources/GrowthCore/Brand/BrandConfig.swift. The final name is not decided (docs/launch-strategy.md §3).
name: GrowthApp
options:
  bundleIdPrefix: com.example.growthapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GrowthPackage:
    path: ..
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_DISPLAY_NAME: "Arcwise"
targets:
  GrowthApp:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Sources
    dependencies:
      - package: GrowthPackage
        product: GrowthCore
      - package: GrowthPackage
        product: AppFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.growthapp
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
