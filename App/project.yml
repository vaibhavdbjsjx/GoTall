# XcodeGen spec for the iOS app target. Generate the project on a Mac with:
#   brew install xcodegen   # developer tool only; not an app dependency
#   cd App && xcodegen generate && open GrowthApp.xcodeproj
#
# Brand: Gromax. APP_DISPLAY_NAME must match BrandConfig.displayName (Sources/GrowthCore/Brand/BrandConfig.swift).
# The bundle ID and product IDs must match what you register in App Store Connect (docs/release-checklist.md).
name: GrowthApp
options:
  bundleIdPrefix: app.stature.height
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GrowthPackage:
    path: ..
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_DISPLAY_NAME: "Gromax"
    # Optional accounts and backup (Supabase). Leave empty to ship without accounts; the Account row then hides.
    # The anon key is public by design: row-level security keeps each account's backup private. docs/backend-setup.md
    STATURE_BACKEND_URL: ""
    STATURE_BACKEND_ANON_KEY: ""
targets:
  GrowthApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
    info:
      path: Config/Info.plist
      properties:
        StatureBackendURL: $(STATURE_BACKEND_URL)
        StatureBackendAnonKey: $(STATURE_BACKEND_ANON_KEY)
    entitlements:
      path: Config/GrowthApp.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: GrowthPackage
        product: GrowthCore
      - package: GrowthPackage
        product: AppFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stature.height
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSCameraUsageDescription: "The posture check uses the front camera to see how your head, shoulders and hips line up. The image is analysed on this iPhone and never saved or sent."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

  # Runs the real StoreKit 2 service against the local StoreKit test environment (Products.storekit).
  GrowthAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/StoreKit
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: GrowthApp
      - package: GrowthPackage
        product: GrowthCore
      - package: GrowthPackage
        product: AppFeatures
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stature.height.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

  # UI tests for the commercial flows (Profile, Premium, paywall, reminders, report).
  GrowthAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: GrowthApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stature.height.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: GrowthApp

schemes:
  GrowthApp:
    build:
      targets:
        GrowthApp: all
    run:
      config: Debug
      # Local StoreKit testing when running from Xcode. Test prices only; real prices come from App Store Connect.
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      targets:
        - GrowthAppTests
        - GrowthAppUITests
    archive:
      config: Release
