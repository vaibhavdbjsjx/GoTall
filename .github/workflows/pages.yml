name: Publish site (privacy, terms, support)

# Publishes site/ to GitHub Pages. Run manually from the Actions tab after enabling Pages
# (Settings › Pages › Source: GitHub Actions). See docs/release-checklist.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild pages from the in-app legal text
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
