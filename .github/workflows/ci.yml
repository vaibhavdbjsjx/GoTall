name: CI

on:
  push:
  pull_request:

jobs:
  core-tests-linux:
    name: Engine and core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test

  ios-build:
    name: iOS build, tests and simulator screenshots
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project App/GrowthApp.xcodeproj \
            -scheme GrowthApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Core tests on macOS (also renders the PDF report pages)
        run: REPORT_PNG_DIR="$PWD/report-pages" swift test
      - name: Capture simulator screenshots
        run: |
          chmod +x scripts/capture_screenshots.sh
          scripts/capture_screenshots.sh build/Build/Products/Debug-iphonesimulator/GrowthApp.app screenshots
      - name: Print downscaled screenshots to the log
        # Lets reviewers without artifact-storage access inspect the screenshots (base64 JPEG, ~600 px).
        run: |
          mkdir -p small
          for f in screenshots/*.png report-pages/*.png; do
            [ -f "$f" ] || continue
            # Phase 1–4 screens were reviewed earlier; printing only new screens keeps the log under the size limit.
            echo "$(basename "$f")" | grep -Eq '^(light-(0[0-9]|1[014-8])|se-(0|15)|max-0|dark-(0|1[0-5])|ax-(0|1[0-3]))' && continue
            n=$(basename "$f" .png)
            sips -Z 600 -s format jpeg -s formatOptions 50 "$f" --out "small/$n.jpg" >/dev/null
            echo "IMG:$n:$(base64 -i "small/$n.jpg" | tr -d '\n')"
          done
      - name: StoreKit and UI tests (iOS Simulator)
        run: scripts/run_ios_tests.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots
            report-pages
          retention-days: 14
