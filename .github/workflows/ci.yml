name: CI

on:
  push:
  pull_request:

jobs:
  core-tests-linux:
    name: Engine and core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: bash scripts/swift_test_annotated.sh

  ios-build:
    name: iOS build, tests and simulator screenshots
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode (newest Xcode 26 for the iOS 26 SDK and Apple's on-device model)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XC:-/Applications/Xcode.app}"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project App/GrowthApp.xcodeproj \
            -scheme GrowthApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Release build for device (unsigned, as submitted)
        run: |
          xcodebuild build \
            -project App/GrowthApp.xcodeproj \
            -scheme GrowthApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO | grep -E "error:|\*\* BUILD"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Core tests on macOS (also renders the PDF report pages)
        run: REPORT_PNG_DIR="$PWD/report-pages" bash scripts/swift_test_annotated.sh
      - name: Capture simulator screenshots
        run: |
          chmod +x scripts/capture_screenshots.sh
          scripts/capture_screenshots.sh build/Build/Products/Debug-iphonesimulator/GrowthApp.app screenshots
      - name: Compose App Store screenshots
        run: |
          python3 -m venv .venv && .venv/bin/pip install --quiet pillow
          .venv/bin/python scripts/make_store_screenshots.py screenshots store-screenshots
      - name: Publish App Store screenshots to the store-assets branch
        # Artifact storage isn't reachable from every review environment; a branch is.
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/assets && cp store-screenshots/*.png /tmp/assets/ && cp screenshots/store-raw-*.png screenshots/max-19-paywall.png /tmp/assets/ 2>/dev/null || true
          cd /tmp/assets && git init -q && git checkout -q -b store-assets && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Store screenshots from ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store-assets
      - name: Print downscaled screenshots to the log
        # Lets reviewers without artifact-storage access inspect the screenshots (base64 JPEG, ~600 px).
        run: |
          mkdir -p small
          for f in screenshots/*.png report-pages/*.png store-screenshots/*.png; do
            [ -f "$f" ] || continue
            # Only screens changed in this pass are printed, which keeps the log under the size limit.
            echo "$(basename "$f")" | grep -Eq '^(light-(01|04|13|19|20|4[0-9])|dark-(01|19|4[0-9])|ax-(19|4[0-9])|se-(01|4[0-9])|appstore-|report-metric-p1)' || continue
            n=$(basename "$f" .png)
            sips -Z 600 -s format jpeg -s formatOptions 50 "$f" --out "small/$n.jpg" >/dev/null
            echo "IMG:$n:$(base64 -i "small/$n.jpg" | tr -d '\n')"
          done
      - name: StoreKit and UI tests (iOS Simulator)
        run: scripts/run_ios_tests.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots
            report-pages
            store-screenshots
          retention-days: 14
