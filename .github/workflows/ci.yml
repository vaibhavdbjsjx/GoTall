name: CI

on:
  push:
  pull_request:

jobs:
  core-tests-linux:
    name: Engine and core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test

  ios-build:
    name: iOS build, tests and simulator screenshots
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project App/GrowthApp.xcodeproj \
            -scheme GrowthApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Core tests on macOS
        run: swift test
      - name: Capture simulator screenshots
        run: |
          chmod +x scripts/capture_screenshots.sh
          scripts/capture_screenshots.sh build/Build/Products/Debug-iphonesimulator/GrowthApp.app screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
