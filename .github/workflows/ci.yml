name: CI

on:
  push:
  pull_request:

jobs:
  core-tests-linux:
    name: GrowthCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test

  ios-build:
    name: iOS app build (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project App/GrowthApp.xcodeproj \
            -scheme GrowthApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Core tests on macOS
        run: swift test
